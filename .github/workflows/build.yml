name: Build Mod JAR

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/01a07e60-bentech"
    paths-ignore:
      - "release/**"
      - "dist/**"
      - "build-log.txt"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain

      - name: Show built artifacts
        run: ls -la build/libs/ || true

      - name: Stage mod JAR into repo (for transfer/persistence)
        run: |
          mkdir -p release
          cp build/libs/bentech-1.0.0.jar release/ || true
          ls -la release/ || true

      - name: Commit mod JAR
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add release || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: build artifact" || true
            git push || true
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: bentech-jar
          path: build/libs/*.jar
          if-no-files-found: warn
