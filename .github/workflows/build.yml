name: Build Mod JAR

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/01a07e60-bentech"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain 2>&1 | tee build-log.txt
        continue-on-error: true

      - name: Show tail of build log
        if: always()
        run: |
          echo "===== BUILD LOG (tail 120) ====="
          tail -n 120 build-log.txt || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bentech-jar
          path: build/libs/*.jar
          if-no-files-found: warn
